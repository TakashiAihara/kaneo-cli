name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PR code runs in this job. Without this, the token actions/checkout
          # leaves in .git/config is readable by whatever the tests execute.
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"

      # The workflow pins Bun on its own; a .mise.toml bump that forgets it
      # would test with one Bun and develop with another.
      - name: bun version matches .mise.toml
        run: grep -qx 'bun = "1.4.0"' .mise.toml

      - run: bun install --frozen-lockfile

      # The client is generated from the pinned OpenAPI document. A hand edit
      # to the generated code, or a document, transformer or registry change
      # committed without regenerating, fails here.
      - name: generated client matches the pinned spec
        run: |
          bun run generate
          git diff --exit-code -- src/api/gen/

      - run: bun run typecheck

      # Formatting and lint are checked here rather than in review: a finding
      # costs one CI run instead of a review round. --deny-warnings keeps a
      # warn-level rule from slipping through.
      - run: bun run lint
      - run: bun run fmt:check

      # Unused exports, files and dependencies fail here rather than in review.
      # tsconfig's noUnusedLocals / noUnusedParameters cover the inside of a file.
      - run: bun run knip

      - run: bun test

      # Every release ships linux/arm64 and darwin, so a build failure there has
      # to stop the pipeline rather than surface at release time.
      - name: build every release target
        run: bun scripts/build.ts

      # The pinned document is the one the Kaneo release shipped. The generate
      # step only proves the client matches the pinned file, so a hand edit to
      # the file itself would pass without this. It reaches
      # raw.githubusercontent.com, a host nothing else here depends on, so it
      # runs last: an outage there should not hide the other results.
      - name: pinned spec matches the Kaneo release
        run: bun run spec --check

  # The CLI against the Kaneo release its client was generated from. A job of
  # its own: it pulls two images and starts a server, and none of that should
  # sit between a push and the result of the checks above.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"

      - name: bun version matches .mise.toml
        run: grep -qx 'bun = "1.4.0"' .mise.toml

      - run: bun install --frozen-lockfile

      - run: bun run e2e
