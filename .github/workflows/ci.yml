name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PR code runs in this job. Without this, the token actions/checkout
          # leaves in .git/config is readable by whatever the tests execute.
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      - run: go test ./... -race

      # Every release ships linux/arm64, so a build failure there has to stop
      # the pipeline rather than surface at release time.
      - name: cross-compile every release target
        run: make cross
