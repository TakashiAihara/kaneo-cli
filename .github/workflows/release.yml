name: release

on:
  push:
    tags: ["v*"]

# Actions are pinned to a commit SHA rather than a tag. A tag can be moved,
# and this job can publish releases.
permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # goreleaser publishes through the API with GITHUB_TOKEN and never
          # pushes over git, so the checkout does not need a stored credential.
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          # Pinned exactly. A floating constraint would let a future release
          # change what this job publishes, and the job holds contents: write.
          version: "2.18.0"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
