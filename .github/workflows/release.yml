name: release

on:
  # Every push to main that passes CI is released. install.sh fetches the latest
  # release, so this is what makes it hand out what is on main rather than
  # whatever was last tagged.
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  # A tag pushed by hand is still released as that tag. This is how a final
  # version is cut.
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "tag to release (for example v0.3.0)"
        required: true

# Actions are pinned to a commit SHA rather than a tag. A tag can be moved,
# and this job can publish releases.
permissions:
  contents: write
  # A checksum from the same release proves nothing about authenticity. Attach
  # provenance so which workflow built it, from which commit, can be verified.
  id-token: write
  attestations: write

# One at a time, so two runs cannot read the same highest tag and both claim
# the next one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    # workflow_run fires for every ci run whose branch is called main, and that
    # includes a pull request from a fork's main. Only a push to this
    # repository's main is a release.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.inputs.tag || github.ref }}
          # Every tag, to count the next one from, and origin/main, to see
          # whether it moved on.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: decide the tag
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          GIVEN: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -eu
          if [ "$EVENT" != workflow_run ]; then
            echo "tag=$GIVEN" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A newer commit is already on main and its own run releases it.
          # Releasing this one afterwards would make older code the latest.
          if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ]; then
            echo "main has moved past this commit; not releasing it"
            exit 0
          fi
          # A re-run for the same commit reuses its tag rather than cutting another.
          existing="$(git tag --points-at HEAD --list 'v*' | head -n 1)"
          echo "tag=${existing:-$(go run ./cmd/next-tag)}" >> "$GITHUB_OUTPUT"

  goreleaser:
    needs: tag
    if: needs.tag.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      # On a manual run inputs.tag and the default branch HEAD disagree. Without
      # an explicit ref, binaries whose contents do not match the tag end up in
      # the release. A missing tag fails here, so nothing is released for it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          # goreleaser publishes through the API with GITHUB_TOKEN and never
          # pushes over git, so the checkout does not need a stored credential.
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # goreleaser reads the version from a tag on HEAD. An automatic release
      # has none yet, so it is created on the built commit through the API. A
      # tag this token creates starts no workflow, so the tag-push trigger above
      # does not release it a second time.
      - name: create the tag if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          set -eu
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            sha="$(git rev-parse HEAD)"
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$sha"
            git tag "$TAG" "$sha"
          fi

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          # Pinned exactly. A floating constraint would let a future release
          # change what this job publishes, and the job holds contents: write.
          version: "2.18.0"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.tar.gz"
