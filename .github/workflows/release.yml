name: release

on:
  # Every push to main that passes CI is released. install.sh fetches the latest
  # release, so this is what makes it hand out what is on main rather than
  # whatever was last tagged.
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  # A tag pushed by hand is still released as that tag. This is how a final
  # version is cut.
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "tag to release (for example v0.3.0)"
        required: true

# Actions are pinned to a commit SHA rather than a tag. A tag can be moved,
# and this workflow can publish releases.
permissions:
  contents: read

# Automatic runs are one at a time, so two cannot read the same highest tag and
# both claim the next one. A newer main push replacing a pending one is fine.
# A group holds one pending run and a newer one replaces it, so only a run that
# will release joins the automatic group: a run for a failed ci (its jobs are
# skipped) gets a group of its own, or it could push out a pending run that was
# going to release. A named tag gets its own group for the same reason.
concurrency:
  group: release-${{ github.event_name == 'workflow_run' && (github.event.workflow_run.conclusion == 'success' && 'auto' || github.run_id) || github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  tag:
    # workflow_run fires for every ci run whose branch is called main, and that
    # includes a pull request from a fork's main. Only a push to this
    # repository's main is a release.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.inputs.tag || github.ref }}
          # Every tag, to count the next one from, and origin/main, to see
          # whether it moved on.
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"

      - name: decide the tag
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          GIVEN: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -eu
          if [ "$EVENT" != workflow_run ]; then
            # A dispatch input is free text. Anything but a version would be
            # checked out as a branch and created as a tag of that name.
            if ! printf '%s\n' "$GIVEN" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
              echo "::error::$GIVEN is not a vX.Y.Z or vX.Y.Z-rc.N tag"
              exit 1
            fi
            echo "tag=$GIVEN" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A newer commit is already on main and its own run releases it.
          # Releasing this one afterwards would make older code the latest.
          # Each side assigned on its own line: inside the if condition set -e
          # does not apply, and a failed rev-parse would compare an empty string,
          # read as "main moved on" and skip the release while showing green.
          main="$(git rev-parse origin/main)"
          head="$(git rev-parse HEAD)"
          if [ "$main" != "$head" ]; then
            echo "main has moved past this commit; not releasing it"
            exit 0
          fi
          # A re-run for the same commit reuses its tag rather than cutting another.
          # Assigned on its own line: set -e does not see a failure inside a
          # substitution embedded in echo's argument, which would output an
          # empty tag, skip the release and still show green.
          tag="$(git tag --points-at HEAD --list 'v*' | head -n 1)"
          if [ -z "$tag" ]; then
            tag="$(bun scripts/next-tag.ts)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  publish:
    needs: tag
    if: needs.tag.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # A checksum from the same release proves nothing about authenticity.
      # Attach provenance so which workflow built it, from which commit, can be
      # verified.
      id-token: write
      attestations: write
    steps:
      # On a manual run inputs.tag and the default branch HEAD disagree. Without
      # an explicit ref, binaries whose contents do not match the tag end up in
      # the release. A missing tag fails here, so nothing is released for it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          # The release is published through the API with GITHUB_TOKEN and
          # nothing is pushed over git, so the checkout needs no stored
          # credential.
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"

      # An automatic release has no tag yet, so it is created on the built
      # commit through the API. A tag this token creates starts no workflow, so
      # the tag-push trigger above does not release it a second time.
      - name: create the tag if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          set -eu
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            sha="$(git rev-parse HEAD)"
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$sha"
            git tag "$TAG" "$sha"
          fi

      - run: bun install --frozen-lockfile

      # The archive names and checksums.txt are the ones install.sh reads.
      - name: build every target
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: bun scripts/build.ts "$TAG"

      # A full release, not a prerelease, even for an rc tag: install.sh
      # installs whatever GitHub calls the latest release, and that has to be
      # what is on main. A re-run for the same tag replaces the assets.
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          set -eu
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Only a re-run for the commit the tag names replaces the assets. A
            # tag on another commit means someone pushed that name first, and
            # overwriting would ship binaries that do not match the tag.
            head="$(git rev-parse HEAD)"
            tagged="$(git rev-parse "refs/tags/$TAG^{commit}")"
            if [ "$tagged" != "$head" ]; then
              echo "::error::$TAG points at $tagged, not the built $head; not replacing its assets"
              exit 1
            fi
            gh release upload "$TAG" dist/*.tar.gz dist/checksums.txt --clobber
          else
            gh release create "$TAG" dist/*.tar.gz dist/checksums.txt --verify-tag --generate-notes --latest
          fi

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.tar.gz"
