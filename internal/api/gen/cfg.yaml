# yaml-language-server: $schema=https://raw.githubusercontent.com/doordash-oss/oapi-codegen-dd/HEAD/configuration-schema.json
package: gen
overlay:
  sources:
    - overlay.json
output:
  use-single-file: true
  directory: .
  filename: client.gen.go
generate:
  client: true
  validation:
    skip: true
filter:
  include:
    # Keep in step with api.Operations; TestRegistryMatchesTheGeneratedClient
    # fails when the two lists differ.
    operation-ids:
      - listOrganization
      - updateOrganization
      - listProjects
      - getProject
      - createProject
      - updateProject
      - archiveProject
      - unarchiveProject
      - listTasks
      - getTask
      - createTask
      - deleteTask
      - updateTaskStatus
      - updateTaskPriority
      - updateTaskAssignee
      - moveTask
      - createTaskRelation
      - getTaskRelations
      - deleteTaskRelation
      - getTaskComments
      - createTaskComment
